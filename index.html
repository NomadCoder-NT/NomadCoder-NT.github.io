<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomadCoder-NT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-content: center;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
            color: #4f46e5;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        h1 span {
            color: #4f46e5;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Countdown Timer Styles */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 90px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            display: block;
        }

        .countdown-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Subscription Form Styles */
        .subscribe-form {
            display: flex;
            max-width: 500px;
            margin: 0 auto 40px auto;
            gap: 10px;
        }

        .subscribe-form input[type="email"] {
            flex: 1;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .subscribe-form input[type="email"]:focus {
            border-color: #4f46e5;
        }

        .subscribe-form button {
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .subscribe-form button:hover {
            background: #4338ca;
        }

        /* Social Links Styles */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #4f46e5;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .countdown { gap: 10px; }
            .countdown-item { min-width: 70px; padding: 10px; }
            .countdown-number { font-size: 1.8rem; }
            .subscribe-form { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">MyBrand</div>
        
        <h1>Something <span>Amazing</span> Is Coming</h1>
        <p class="subtitle">We are working hard to build an incredible experience. Enter your email below to get notified when we officially launch!</p>

        <!-- Countdown Timer -->
        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <!-- Subscription Form -->
        <form class="subscribe-form" action="#" method="POST" onsubmit="alert('Thank you for subscribing!'); return false;">
            <input type="email" placeholder="Your email address" required>
            <button type="submit">Notify Me</button>
        </form>

        <!-- Social Media Links -->
        <div class="social-links">
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
            <a href="#">LinkedIn</a>
        </div>
    </div>

    <script>
        // Set your target launch date here (Format: YYYY-MM-DDTHH:MM:SS)
        // This sets the countdown to exactly 30 days from now for demonstration purposes
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30); 

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            // Time calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the results into the elements
            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            // If the countdown is finished, display generic text
            if (distance < 0) {
                clearInterval(intervalId);
                document.querySelector(".countdown").innerHTML = "<h2>We have launched!</h2>";
            }
        }

        // Update the countdown every 1 second
        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown(); // Run immediately on load
    </script>
</body>
</html>
